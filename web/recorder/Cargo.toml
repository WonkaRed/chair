[package]
name = "chair-web-recorder"
description = "Records a scripted run of the real $CHAIR wasm in a local NEAR sandbox as the page's fixture. Not part of the root workspace."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone on purpose: the root workspace belongs to the contract lanes. Cargo.lock starts as a copy of theirs.
[workspace]

[dependencies]
sandbox-tests = { path = "../../sandbox-tests" }
near-workspaces = "0.24.0"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
