# Publishes web/dist to GitHub Pages. Manual only: nothing is published until someone runs this workflow from the
# Actions tab (and the repository's Settings > Pages > Source is set to "GitHub Actions"). The page uses relative URLs, so
# it works under https://<user>.github.io/<repo>/ as built; it reads the chain named in web/config.js over public RPC.
name: Deploy web to Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # web/README.md asks for Node 22.22.2 or newer; "22" resolves to the newest 22.x.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: make -C web build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
